<rect x="20" y="630" width="180" height="50" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="110" y="650" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Depozite materiale</text>
<text x="110" y="668" text-anchor="middle" font-size="11" fill="#5F5E5A">nord Moldova · palet min.</text>

<rect x="250" y="630" width="180" height="50" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="650" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Contracte bloc B2B</text>
<text x="340" y="668" text-anchor="middle" font-size="11" fill="#5F5E5A">TIR plin · 20 paleți</text>

<rect x="480" y="630" width="180" height="50" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="570" y="650" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Retail &amp; magazine</text>
<text x="570" y="668" text-anchor="middle" font-size="11" fill="#5F5E5A">Chișinău + export nord RO</text>

