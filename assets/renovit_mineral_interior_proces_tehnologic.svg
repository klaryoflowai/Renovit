<line x1="340" y1="610" x2="340" y2="628" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="570" y1="610" x2="570" y2="628" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

