<svg width="900" viewBox="0 0 680 710" role="img" xmlns="http://www.w3.org/2000/svg" style="background:#f7f4ef;font-family:'Segoe UI',Arial,sans-serif">
<title>Proces Tehnologic RENOVIT Mineral Interior — De la extracție la distribuție</title>
<desc>Trei fluxuri paralele de materie primă (agregat calcaros, filler micronizat, argilă sub-bentonitică) plus liant extern convergând la dozare, control calitate, ambalare și 3 canale de distribuție</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- TITLE -->
<text x="340" y="20" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="2" fill="#5F5E5A">RENOVIT MINERAL INTERIOR · PROCES TEHNOLOGIC INTEGRAL</text>

<!-- ═══ PHASE ZONE BACKGROUNDS ═══ -->
<rect x="14" y="36" width="185" height="226" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<rect x="248" y="36" width="185" height="226" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="480" y="36" width="185" height="298" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>

<!-- PHASE HEADER STRIPS -->
<rect x="14" y="36" width="185" height="20" rx="4" fill="#EF9F27"/>
<text x="107" y="50" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.2" fill="#412402">FLUX A · AGREGAT CALCAROS</text>

<rect x="248" y="36" width="185" height="20" rx="4" fill="#1D9E75"/>
<text x="340" y="50" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.2" fill="#04342C">FLUX B · FILLER MICRONIZAT</text>

<rect x="480" y="36" width="185" height="20" rx="4" fill="#D85A30"/>
<text x="572" y="50" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.2" fill="#4A1B0C">FLUX C · ARGILĂ SUB-BENT.</text>

<!-- helper: node macro - amber fill #FAC775 bg, #633806 text -->

<!-- ═══ FLUX A ═══ -->
<!-- A1 -->
<rect x="18" y="62" width="177" height="52" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="107" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Extracție primară</text>
<text x="107" y="101" text-anchor="middle" font-size="11" fill="#854F0B">concasor cu fălci · &lt;50mm</text>
<line x1="107" y1="114" x2="107" y2="132" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- A2 -->
<rect x="18" y="134" width="177" height="52" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="107" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Concasare &amp; spălare</text>
<text x="107" y="173" text-anchor="middle" font-size="11" fill="#854F0B">fracție &lt;5mm · fără argilă</text>
<line x1="107" y1="186" x2="107" y2="204" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- A3 -->
<rect x="18" y="206" width="177" height="52" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="107" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Cernere &amp; stocare</text>
<text x="107" y="245" text-anchor="middle" font-size="11" fill="#854F0B">3 fracții → silozuri separate</text>

<!-- ═══ FLUX B ═══ -->
<!-- B1 -->
<rect x="252" y="62" width="177" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Alimentare moară</text>
<text x="340" y="101" text-anchor="middle" font-size="11" fill="#0F6E56">praf tăiere + calcar Volodeni</text>
<line x1="340" y1="114" x2="340" y2="132" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- B2 -->
<rect x="252" y="134" width="177" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Măcinare fină</text>
<text x="340" y="173" text-anchor="middle" font-size="11" fill="#0F6E56">D50 &lt;0.05 · D90 &lt;0.15mm</text>
<line x1="340" y1="186" x2="340" y2="204" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- B3 -->
<rect x="252" y="206" width="177" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Omogenizare &amp; siloz</text>
<text x="340" y="245" text-anchor="middle" font-size="11" fill="#0F6E56">siloz etanș · umid. &lt;0.5%</text>

<!-- ═══ FLUX C ═══ -->
<!-- C1 -->
<rect x="484" y="62" width="177" height="52" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="572" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Extracție argilă</text>
<text x="572" y="101" text-anchor="middle" font-size="11" fill="#712B13">pre-uscare naturală 20–30%</text>
<line x1="572" y1="114" x2="572" y2="132" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- C2 — CRITICAL -->
<rect x="484" y="134" width="177" height="52" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="572" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Uscare termică</text>
<text x="572" y="173" text-anchor="middle" font-size="11" fill="#712B13">100–120°C · umid. &lt;5% ⚠</text>
<line x1="572" y1="186" x2="572" y2="204" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- C3 -->
<rect x="484" y="206" width="177" height="52" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="572" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Măcinare fină</text>
<text x="572" y="245" text-anchor="middle" font-size="11" fill="#712B13">D90 &lt;0.08mm · moară pendule</text>
<line x1="572" y1="258" x2="572" y2="276" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- C4 — KEY TEST -->
<rect x="484" y="278" width="177" height="52" rx="7" fill="#F5C4B3" stroke="#D85A30" stroke-width="1.5"/>
<text x="572" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Test activitate Enslin</text>
<text x="572" y="317" text-anchor="middle" font-size="11" fill="#712B13">≥6–10 ml/2g · ajust. formulă</text>

<!-- ═══ CONVERGENCE PATHS ═══ -->
<!-- A3 → junction (down then right) -->
<path d="M107,258 L107,340 L337,340" fill="none" stroke="#888780" stroke-width="1"/>
<!-- B3 → junction (straight down) -->
<line x1="340" y1="258" x2="340" y2="340" stroke="#888780" stroke-width="1"/>
<!-- C4 → junction (down then left) -->
<path d="M572,330 L572,340 L343,340" fill="none" stroke="#888780" stroke-width="1"/>
<!-- Junction dot -->
<circle cx="340" cy="340" r="3.5" fill="#888780"/>
<!-- Junction → E5 arrow -->
<line x1="340" y1="344" x2="340" y2="358" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>

<!-- ═══ FLUX D — LIANT EXTERN ═══ -->
<text x="604" y="372" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1" fill="#185FA5">FLUX D · EXTERN</text>
<rect x="534" y="378" width="138" height="46" rx="7" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="4 2"/>
<text x="603" y="397" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Var hidraulic</text>
<text x="603" y="414" text-anchor="middle" font-size="11" fill="#185FA5">NHL 3.5–5 · ≤8% din formulă</text>
<!-- D → E5 dashed arrow -->
<line x1="534" y1="401" x2="516" y2="401" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- ═══ E5 — DOZARE & MALAXARE (key node) ═══ -->
<rect x="163" y="360" width="352" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="340" y="381" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">Dozare gravimetrică &amp; malaxare</text>
<text x="340" y="401" text-anchor="middle" font-size="11" fill="#534AB7">±0.5% · ordinea: agregat→filler→argilă→var</text>
<text x="340" y="419" text-anchor="middle" font-size="11" fill="#534AB7">malaxare forțată 20–40 rpm · 4–6 min</text>

<!-- E5 → E6 -->
<line x1="340" y1="430" x2="340" y2="448" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ═══ E6 — CONTROL CALITATE ═══ -->
<rect x="213" y="450" width="254" height="54" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Control calitate produs</text>
<text x="340" y="490" text-anchor="middle" font-size="11" fill="#5F5E5A">teste rapide lot + validare 28 zile EN</text>

<!-- E6 → E7 -->
<line x1="340" y1="504" x2="340" y2="522" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ═══ E7 — AMBALARE (key node) ═══ -->
<rect x="213" y="524" width="254" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="340" y="545" text-anchor="middle" font-size="14" font-weight="700" fill="#173404">Ambalare RENOVIT 25 kg</text>
<text x="340" y="565" text-anchor="middle" font-size="11" fill="#3B6D11">sac PP laminat · lot &amp; dată imprimat</text>
<text x="340" y="582" text-anchor="middle" font-size="11" fill="#3B6D11">42 saci/palet · stretch · QR trasabilitate</text>

<!-- ═══ E8 — T-BRANCH DISTRIBUȚIE ═══ -->
<line x1="340" y1="594" x2="340" y2="610" stroke="#888780" stroke-width="1"/>
<line x1="110" y1="610" x2="570" y2="610" stroke="#888780" stroke-width="1"/>
<circle cx="340" cy="610" r="2.5" fill="#888780"/>
<circle cx="110" cy="610" r="2" fill="#888780"/>
<circle cx="570" cy="610" r="2" fill="#888780"/>
