<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RENOVIT — Proces Tehnologic Gips</title>
    <meta name="description" content="Harta procesului tehnologic pentru productie tencuiala gipsata RENOVIT.">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f2e8;
        --paper: #fffaf0;
        --ink: #1f1b14;
        --muted: #776b5b;
        --line: #dfd1b8;
        --accent: #ba7517;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 10% 0%, rgba(186, 117, 23, 0.16), transparent 28rem),
          linear-gradient(180deg, #fbf4e8 0%, var(--bg) 55%, #efe3cf 100%);
        color: var(--ink);
      }

      header {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 28px 18px 12px;
        font-family: "DM Mono", "Courier New", monospace;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 6px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: clamp(28px, 7vw, 54px);
        line-height: 0.95;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
        max-width: 60ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .actions a {
        color: var(--ink);
        border: 1px solid var(--line);
        background: rgba(255, 250, 240, 0.72);
        padding: 9px 12px;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 8px 10px 40px;
      }

      #root {
        background: rgba(255, 250, 240, 0.76);
        border: 1px solid var(--line);
        box-shadow: 0 30px 80px rgba(60, 36, 8, 0.12);
      }

      #status {
        padding: 28px;
        font-family: "DM Mono", "Courier New", monospace;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">RENOVIT tool</div>
      <h1>Proces tehnologic gips</h1>
      <div class="sub">Hartă interactivă pentru fluxul carieră gips Edineț → tencuială ambalată 30kg.</div>
      <div class="actions">
        <a href="/">Calculator unit economics</a>
        <a href="/raport-vizita-cariera.html">Raport vizită carieră</a>
        <a href="/assets/proces_tehnologic_gips_renovit.svg">SVG detaliat</a>
      </div>
    </header>
    <main>
      <div id="status">Se încarcă instrumentul...</div>
      <div id="root"></div>
    </main>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/apps/run-jsx.js" data-src="/apps/src/proces-tehnologic-gips.jsx"></script>
  </body>
</html>
